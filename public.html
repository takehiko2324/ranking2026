<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Ranking</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f8f9fa;
    }

    h2 {
      text-align: center;
      margin-bottom: 12px;
      font-weight: bold;
      color: #343a40;
    }

    .search-box {
      text-align: center;
      margin: 0 auto 18px;
    }

    .search-box label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .search-box input {
      width: 220px;
      max-width: 70vw;
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 5px;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .search-box button {
      margin-left: 6px;
      padding: 8px 14px;
      border: 1px solid #adb5bd;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }

    .search-box button:hover {
      background: #e9ecef;
    }

    #search-result {
      margin-top: 8px;
      min-height: 1.5em;
      font-weight: bold;
    }

    .table-wrapper {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      font-size: 1rem;
      border-collapse: collapse;
    }

    th, td {
      white-space: nowrap;
      padding: 8px 12px;
    }

    table.dataTable thead {
      background-color: #343a40;
      color: white;
    }

    table.dataTable tbody tr:first-child {
      background-color: #ffeeba !important;
      font-weight: bold;
    }

    table.dataTable tbody tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    table.dataTable tbody tr:hover {
      background-color: #d6eaff;
    }

    .dataTables_filter {
      display: none;
    }

    .dataTables_wrapper .dataTables_length select {
      border-radius: 5px;
      border: 1px solid #ced4da;
      padding: 5px;
    }

    @media (max-width: 576px) {
      table {
        font-size: 0.75rem;
      }

      th, td {
        padding: 6px 8px;
      }

      .search-box input {
        width: 170px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

  <h2>Ranking</h2>

  <div class="search-box">
    <label for="management-search">管理コード検索</label>
    <input
      type="text"
      id="management-search"
      placeholder="例：KA010001"
      autocomplete="off"
    >
    <button type="button" id="clear-search">クリア</button>
    <div id="search-result"></div>
  </div>

  <div class="table-wrapper">
    <table id="ranking-table" class="display">
      <thead>
        <tr>
          <th>順位</th>
          <th>管理コード</th>
          <th>合計スコア</th>
          <th>センター</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    $(document).ready(function () {
      Papa.parse('ranking.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,

        complete: function (results) {
          const rows = results.data.filter(row =>
            row["順位"] &&
            row["管理No"] &&
            row["合計スコア"] &&
            row["センター"]
          );

          const table = $('#ranking-table').DataTable({
            data: rows,
            columns: [
              { data: "順位" },
              { data: "管理No" },
              { data: "合計スコア" },
              { data: "センター" }
            ],
            language: {
              url: "https://cdn.datatables.net/plug-ins/1.13.4/i18n/ja.json"
            },
            pageLength: 25,
            order: [[0, "asc"]]
          });

          function applyManagementSearch() {
            const value = $('#management-search').val().trim().toUpperCase();

            if (!value) {
              table.column(1).search('').draw();
              $('#search-result').text('');
              return;
            }

            table.column(1).search('^' + $.fn.dataTable.util.escapeRegex(value) + '$', true, false).draw();

            const count = table.rows({ search: 'applied' }).count();

            if (count === 1) {
              const row = table.row({ search: 'applied' }).data();
              $('#search-result').text(
                '順位 ' + row["順位"] + '位 ／ 合計スコア ' + row["合計スコア"] +
                ' ／ ' + row["センター"]
              );
            } else {
              $('#search-result').text('該当する管理コードがありません。');
            }
          }

          $('#management-search').on('input', applyManagementSearch);

          $('#clear-search').on('click', function () {
            $('#management-search').val('');
            table.column(1).search('').draw();
            $('#search-result').text('');
            $('#management-search').focus();
          });
        }
      });
    });
  </script>

</body>
</html>
