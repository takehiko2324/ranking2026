<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>登録データ確認｜3万人フリータイム2026</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Noto Sans JP", sans-serif;
}

.container {
  width: min(920px, calc(100% - 28px));
  margin: 0 auto;
  padding: 32px 0 50px;
}

h1 {
  margin: 0 0 5px;
  font-size: 25px;
}

.subtitle {
  margin-bottom: 14px;
  color: #666;
  font-size: 14px;
}

/* 修正依頼 */
.correction-area {
  margin: 0 0 18px;
}

.correction-button {
  display: block;
  width: 100%;
  padding: 14px 18px;
  background: #e85d04;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: 800;
  border-radius: 9px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.16);
}

.correction-button:hover {
  opacity: 0.88;
}

.search-box {
  padding: 16px;
  margin-bottom: 18px;
  background: #fff;
  border-radius: 9px;
}

.controls {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
}

.control {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

label {
  font-size: 13px;
  font-weight: 700;
}

select {
  min-width: 145px;
  height: 40px;
  padding: 0 10px;
  border: 1px solid #aaa;
  background: #fff;
  font-size: 16px;
}

button {
  height: 40px;
  padding: 0 24px;
  border: 1px solid #888;
  background: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  background: #eef2f6;
}

.result-info {
  margin: 12px 2px 8px;
  font-size: 15px;
  font-weight: 700;
}

.table-wrap {
  background: #fff;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 520px;
  border-collapse: collapse;
}

th, td {
  padding: 11px 10px;
  border-bottom: 1px solid #ddd;
  text-align: center;
}

th {
  background: #e9eef5;
  white-space: nowrap;
}

td:first-child {
  font-weight: 700;
}

.message {
  padding: 28px 12px;
  background: #fff;
  color: #666;
  text-align: center;
}

@media (max-width: 600px) {
  .container {
    width: calc(100% - 16px);
    padding-top: 18px;
  }

  h1 {
    font-size: 21px;
  }

  .correction-button {
    font-size: 15px;
    padding: 13px 12px;
  }

  .search-box {
    padding: 12px;
  }

  .controls {
    gap: 8px;
  }

  select {
    min-width: 118px;
  }

  button {
    padding: 0 18px;
  }

  th, td {
    padding: 9px 7px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>登録データ確認</h1>

  <div class="subtitle">
    3万人フリータイムイベント2026　担当者確認用
  </div>

  <div class="correction-area">
    <a
      href="https://padlet.com/kanjoukyou/submission-request/y5WkX4eEGp7nvmxG?section=384263258"
      target="_blank"
      rel="noopener noreferrer"
      class="correction-button"
    >
      ⚠ 入力内容の修正依頼はこちら
    </a>
  </div>

  <div class="search-box">
    <div class="controls">

      <div class="control">
        <label for="prefecture">県記号</label>
        <select id="prefecture">
          <option value="">選択してください</option>
          <option value="KA">KA</option>
          <option value="TK">TK</option>
          <option value="SA">SA</option>
          <option value="CH">CH</option>
          <option value="TC">TC</option>
          <option value="GU">GU</option>
          <option value="IB">IB</option>
          <option value="NA">NA</option>
          <option value="YA">YA</option>
        </select>
      </div>

      <div class="control">
        <label for="center">センターコード</label>
        <select id="center">
          <option value="">選択してください</option>
          <option value="01">01</option>
          <option value="02">02</option>
          <option value="03">03</option>
          <option value="04">04</option>
          <option value="05">05</option>
          <option value="06">06</option>
          <option value="07">07</option>
          <option value="08">08</option>
          <option value="09">09</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
        </select>
      </div>

      <button id="showButton" type="button">表示</button>

    </div>
  </div>

  <div id="resultInfo" class="result-info"></div>

  <div class="table-wrap">

    <table id="resultTable" style="display:none;">
      <thead>
        <tr>
          <th>管理No</th>
          <th>G1</th>
          <th>G2</th>
          <th>G3</th>
          <th>合計</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>

    <div id="message" class="message">
      県記号とセンターコードを選択してください。
    </div>

  </div>

</div>

<script>

let allData = [];

/* check.csv 読み込み */
fetch("check.csv?ts=" + Date.now())

  .then(response => {
    if (!response.ok) {
      throw new Error("check.csvを読み込めませんでした");
    }
    return response.text();
  })

  .then(text => {

    text = text.replace(/^\uFEFF/, "");

    const lines = text
      .split(/\r?\n/)
      .filter(line => line.trim() !== "");

    if (lines.length <= 1) {
      throw new Error("check.csvにデータがありません");
    }

    /*
      check.csv
      0 = CenterKey
      1 = 管理No
      2 = G1
      3 = G2
      4 = G3
      5 = Total
    */

    allData = lines
      .map(line => {

        const cols = parseCSVLine(line);

        return {
          centerKey: cleanValue(cols[0]),
          managementNo: cleanValue(cols[1]),
          g1: cleanValue(cols[2]),
          g2: cleanValue(cols[3]),
          g3: cleanValue(cols[4]),
          total: cleanValue(cols[5])
        };

      })
      .filter(row => row.managementNo !== "");

  })

  .catch(error => {

    console.error(error);

    document.getElementById("message").textContent =
      "登録データを読み込めませんでした。";

  });


/* 表示 */
document
  .getElementById("showButton")
  .addEventListener("click", function () {

    const prefecture =
      document.getElementById("prefecture").value;

    const centerNo =
      document.getElementById("center").value;

    if (!prefecture || !centerNo) {
      alert("県記号とセンターコードを選択してください。");
      return;
    }

    /* GU + 03 → GU03 */
    const centerCode = prefecture + centerNo;

    const results = allData
      .filter(row =>
        row.centerKey === centerCode ||
        row.managementNo.startsWith(centerCode)
      )
      .sort((a, b) =>
        a.managementNo.localeCompare(
          b.managementNo,
          "ja",
          {
            numeric: true,
            sensitivity: "base"
          }
        )
      );

    displayResults(centerCode, results);

  });


function displayResults(centerCode, results) {

  const tbody =
    document.getElementById("resultBody");

  const table =
    document.getElementById("resultTable");

  const message =
    document.getElementById("message");

  const resultInfo =
    document.getElementById("resultInfo");

  tbody.innerHTML = "";

  if (results.length === 0) {

    table.style.display = "none";
    message.style.display = "block";

    message.textContent =
      centerCode + " の登録データはありません。";

    resultInfo.textContent = "";

    return;
  }

  results.forEach(row => {

    const tr = document.createElement("tr");

    tr.innerHTML =
      "<td>" + escapeHtml(row.managementNo) + "</td>" +
      "<td>" + escapeHtml(row.g1) + "</td>" +
      "<td>" + escapeHtml(row.g2) + "</td>" +
      "<td>" + escapeHtml(row.g3) + "</td>" +
      "<td>" + escapeHtml(row.total) + "</td>";

    tbody.appendChild(tr);

  });

  message.style.display = "none";
  table.style.display = "table";

  resultInfo.textContent =
    centerCode + "　登録件数：" +
    results.length + "件";
}


/* CSV解析 */
function parseCSVLine(line) {

  const result = [];
  let current = "";
  let insideQuotes = false;

  for (let i = 0; i < line.length; i++) {

    const char = line[i];

    if (char === '"') {

      if (insideQuotes && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }

    } else if (char === "," && !insideQuotes) {

      result.push(current);
      current = "";

    } else {

      current += char;

    }
  }

  result.push(current);

  return result;
}


function cleanValue(value) {

  if (value === undefined || value === null) {
    return "";
  }

  return String(value).trim();
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
