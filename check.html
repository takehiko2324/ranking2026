<script>

let allData = [];

const prefectureCodes = [
  "KA", "TK", "SA", "CH", "TC",
  "GU", "IB", "NA", "YA"
];

fetch("check.csv?ts=" + Date.now())
  .then(response => {
    if (!response.ok) {
      throw new Error("check.csvを読み込めませんでした");
    }
    return response.text();
  })
  .then(text => {

    const lines = text
      .replace(/^\uFEFF/, "")
      .trim()
      .split(/\r?\n/);

    allData = lines.slice(1).map(line => {

      const cols = line.split(",");

      return {
        managementNo: (cols[0] || "").trim().replace(/^"|"$/g, ""),
        g1: (cols[1] || "").trim().replace(/^"|"$/g, ""),
        g2: (cols[2] || "").trim().replace(/^"|"$/g, ""),
        g3: (cols[3] || "").trim().replace(/^"|"$/g, ""),
        total: (cols[4] || "").trim().replace(/^"|"$/g, "")
      };

    }).filter(row => row.managementNo);

    createPrefectureList();
    createCenterList();

  })
  .catch(error => {

    document.getElementById("message").textContent =
      "データを読み込めませんでした。";

    console.error(error);

  });


function createPrefectureList() {

  const select =
    document.getElementById("prefecture");

  prefectureCodes.forEach(code => {

    const option =
      document.createElement("option");

    option.value = code;
    option.textContent = code;

    select.appendChild(option);

  });

}


function createCenterList() {

  const select =
    document.getElementById("center");

  select.innerHTML =
    '<option value="">選択してください</option>';

  for (let i = 1; i <= 18; i++) {

    const code =
      String(i).padStart(2, "0");

    const option =
      document.createElement("option");

    option.value = code;
    option.textContent = code;

    select.appendChild(option);

  }

  select.disabled = false;

}


document.getElementById("showButton")
.addEventListener("click", function() {

  const prefecture =
    document.getElementById("prefecture").value;

  const centerNo =
    document.getElementById("center").value;

  if (!prefecture || !centerNo) {

    alert("県記号とセンターコードを選択してください。");
    return;

  }

  const centerCode =
    prefecture + centerNo;

  const results =
    allData
      .filter(row =>
        row.managementNo.startsWith(centerCode)
      )
      .sort((a,b) =>
        a.managementNo.localeCompare(
          b.managementNo,
          undefined,
          { numeric:true }
        )
      );

  const tbody =
    document.getElementById("resultBody");

  tbody.innerHTML = "";

  results.forEach(row => {

    const tr =
      document.createElement("tr");

    tr.innerHTML = `
      <td>${escapeHtml(row.managementNo)}</td>
      <td>${escapeHtml(row.g1)}</td>
      <td>${escapeHtml(row.g2)}</td>
      <td>${escapeHtml(row.g3)}</td>
      <td>${escapeHtml(row.total)}</td>
    `;

    tbody.appendChild(tr);

  });

  const table =
    document.getElementById("resultTable");

  const message =
    document.getElementById("message");

  if (results.length === 0) {

    table.style.display = "none";

    message.style.display = "block";
    message.textContent =
      "該当する登録データはありません。";

    document.getElementById("resultInfo")
      .textContent = "";

  } else {

    message.style.display = "none";
    table.style.display = "table";

    document.getElementById("resultInfo")
      .textContent =
      centerCode + "　登録件数：" +
      results.length + "件";

  }

});


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>
